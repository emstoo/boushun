# Merge after compose.yaml. Only this synthetic namespace receives test traffic.
services:
  boushun:
    network_mode: service:fixture
    restart: "no"
    environment:
      BOUSHUN_SNMP_CONFIG: /run/boushun-inputs/snmp.json
      KUBECONFIG: /run/boushun-inputs/kubeconfig
      BOUSHUN_CONTROLLER_SNAPSHOT_PATHS: /run/boushun-inputs/controller.json
      BOUSHUN_DHCP_LEASE_PATHS: /run/boushun-inputs/dnsmasq.leases
    depends_on:
      fixture:
        condition: service_healthy
      responder:
        condition: service_healthy
    volumes:
      - ./test/container:/acceptance:ro
      - ./test/container/resolv.conf:/etc/resolv.conf:ro
      - ./test/container/inputs:/run/boushun-inputs:ro

  fixture:
    image: boushun-ci-boushun
    user: root
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      acceptance:
        ipv4_address: 192.168.50.2
    volumes:
      - ./test/container:/acceptance:ro
    command: ["node", "/acceptance/fixture.mjs"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:45178').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 1s
      timeout: 3s
      retries: 10

  responder:
    image: boushun-ci-boushun
    user: node
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      acceptance:
        ipv4_address: 192.168.50.3
    environment:
      BOUSHUN_FIXTURE_PORT: "45179"
    volumes:
      - ./test/container:/acceptance:ro
    command: ["node", "/acceptance/fixture.mjs"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:45179').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 1s
      timeout: 3s
      retries: 10

networks:
  acceptance:
    internal: true
    ipam:
      config:
        - subnet: 192.168.50.0/24
